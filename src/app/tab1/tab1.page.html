<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Counter App
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-header>
      <ion-card-title valid>{{ counterName }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-input 
      type="string" 
      (ionChange)="ChangeCounterName($event)" 
      placeholder="Counter name"
      label="Název počítadla"
      label-placement="stacked"
      fill="outline">   
      </ion-input>
      <h1 class="counter-value">{{ count }}</h1>
      <div class="counter-actions">
        <ion-button (click)="Increment()" color="success">+1</ion-button>
        <ion-button (click)="Decrement()" color="danger">-1</ion-button>
        <ion-button (click)="Reset()" color="medium" fill="outline" [disabled]="count === 0">Reset</ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
